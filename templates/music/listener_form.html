{% extends "base.html" %}

{% block title %}{% if object %}Edit listener{% else %}New listener{% endif %}{% endblock %}

{% block content %}
  <h1>{% if object %}Edit listener{% else %}New listener{% endif %}</h1>

  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save</button>
    <a href="{% url 'music:listener-list' %}">Cancel</a>
  </form>
{% endblock %}
