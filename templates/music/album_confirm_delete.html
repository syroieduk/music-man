{% extends "base.html" %}

{% block title %}Delete album{% endblock %}

{% block content %}
  <h1 class="h3 mb-3">Delete album</h1>
  <p>Are you sure you want to delete «{{ object.name }}»?</p>

  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, delete</button>
    <a class="btn btn-link" href="{% url 'music:album-detail' object.pk %}">Cancel</a>
  </form>
{% endblock %}
