{% extends "base.html" %}

{% block title %}{% if object %}Edit mood{% else %}New mood{% endif %}{% endblock %}

{% block content %}
  <h1 class="h3 mb-3">{% if object %}Edit mood{% else %}New mood{% endif %}</h1>

  <form method="post" enctype="multipart/form-data" class="col-md-6">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Save</button>
    <a class="btn btn-link" href="{% url 'music:mood-list' %}">Cancel</a>
  </form>
{% endblock %}
