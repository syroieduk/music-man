{% extends "base.html" %}

{% block title %}{% if object %}Edit song{% else %}New song{% endif %}{% endblock %}

{% block content %}
  <h1 class="h3 mb-3">{% if object %}Edit song{% else %}New song{% endif %}</h1>

  <form method="post" enctype="multipart/form-data" class="col-md-6">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Save</button>
    <a class="btn btn-link" href="{% url 'music:song-list' %}">Cancel</a>
  </form>
{% endblock %}
