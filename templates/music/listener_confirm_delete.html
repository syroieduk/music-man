{% extends "base.html" %}

{% block title %}Delete listener{% endblock %}

{% block content %}
  <h1>Delete listener</h1>
  <p>Are you sure you want to delete «{{ object.username }}»?</p>

  <form method="post">
    {% csrf_token %}
    <button type="submit">Yes, delete</button>
    <a href="{% url 'music:listener-detail' object.pk %}">Cancel</a>
  </form>
{% endblock %}
