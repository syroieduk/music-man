{% extends "base.html" %}

{% block title %}Delete song{% endblock %}

{% block content %}
  <h1>Delete song</h1>
  <p>Are you sure you want to delete «{{ object.name }}»?</p>

  <form method="post">
    {% csrf_token %}
    <button type="submit">Yes, delete</button>
    <a href="{% url 'music:song-detail' object.pk %}">Cancel</a>
  </form>
{% endblock %}
